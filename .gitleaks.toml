[extend]
useDefault = true

[[rules]]
id = "openrouter-key"
description = "OpenRouter API key"
regex = '''sk-or-v1-[0-9a-fA-F]{48,}'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "umami-api-key"
description = "Umami API key"
regex = '''api_[A-Za-z0-9]{24,}'''
keywords = ["api_"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''[0-9]{8,12}:[A-Za-z0-9_-]{30,}'''

[[rules]]
id = "nocodb-token-header"
description = "Hard-coded NocoDB token header"
regex = '''(?i)(xc-token|xc-auth)["'[:space:]]*[:=]["'[:space:]]+[A-Za-z0-9._-]{20,}'''
keywords = ["xc-token", "xc-auth"]
