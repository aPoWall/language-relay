name: macOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata
        run: plutil -lint Info.plist LaunchAgent.plist
      - name: Build and test core
        run: make test
      - name: Test offscreen UI
        run: '".build/Type Relay.app/Contents/MacOS/LayoutPilot" --ui-self-test'
      - name: Verify signature and audio bundle
        run: |
          codesign --verify --deep --strict ".build/Type Relay.app"
          test "$(find ".build/Type Relay.app/Contents/Resources/Sounds" -name '*.aiff' | wc -l | tr -d ' ')" = 4
