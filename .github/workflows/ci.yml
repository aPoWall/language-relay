name: macOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata
        run: plutil -lint Info.plist LaunchAgent.plist
      - name: Build and test core
        run: make test
      - name: Test offscreen UI
        run: '".build/Language Relay.app/Contents/MacOS/LanguageRelay" --ui-self-test'
      - name: Verify signature and audio bundle
        run: |
          codesign --verify --deep --strict ".build/Language Relay.app"
          test "$(find ".build/Language Relay.app/Contents/Resources/Sounds" -name '*.aiff' | wc -l | tr -d ' ')" = 8
      - name: Validate agent CLI and website assets
        run: |
          node --check bin/language-relay.mjs
          npm pack --dry-run >/dev/null
          test "$(find docs/sounds -name '*.mp3' | wc -l | tr -d ' ')" = 8
          ! grep -q '<audio' docs/index.html
